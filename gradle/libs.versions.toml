# To manually find version numbers, use
# https://linkie.shedaniel.dev/dependencies
# https://fabricmc.net/develop

[versions]
balm = "26.2.0.4"
clothConfig = "26.2.155"
junit = "6.1.2"
mockito = "5.23.0"

[libraries]
balmCommon = { module = "net.blay09.mods:balm-common", version.ref = "balm" }
balmFabric = { module = "net.blay09.mods:balm-fabric", version.ref = "balm" }
balmNeoForge = { module = "net.blay09.mods:balm-neoforge", version.ref = "balm" }
clothConfigCommon = { module = "me.shedaniel.cloth:cloth-config", version.ref = "clothConfig" }
clothConfigFabric = { module = "me.shedaniel.cloth:cloth-config-fabric", version.ref = "clothConfig" }
clothConfigNeoForge = { module = "me.shedaniel.cloth:cloth-config-neoforge", version.ref = "clothConfig" }
fabricApi = "net.fabricmc.fabric-api:fabric-api:0.155.3+"
fabricLoader = "net.fabricmc:fabric-loader:0.19.3"
jadeFabric = "maven.modrinth:jade:26.2.9+fabric"
jadeNeoForge = "maven.modrinth:jade:26.2.8+neoforge"
jsr305 = "com.google.code.findbugs:jsr305:3.0.2"
lombok = "org.projectlombok:lombok:1.18.46"
minecraft = "com.mojang:minecraft:26.2"
modMenu = "com.terraformersmc:modmenu:20.0.1"
neoForge = "net.neoforged:neoforge:26.2.0.32-beta"
neoforgeFancymodloaderLoader = "net.neoforged.fancymodloader:loader:11.0.16"
tolk = "com.davykager.tolk:Tolk:1.0.0"

assertjCore = "org.assertj:assertj-core:3.27.7"
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junitJupiterParams = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
mockitoCore = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockitoJunitJupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

checkstyle = "com.puppycrawl.tools:checkstyle:13.8.0"

[plugins]
gitVersion = { id = "com.palantir.git-version", version = "5.0.0" }
mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
