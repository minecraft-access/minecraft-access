plugins {
    alias(libs.plugins.shadow)
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    log4jConfigs.from(file("../log4j.xml"))
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge libs.neoForge

    modRuntimeOnly libs.balmNeoForge
    include libs.balmNeoForge

    modImplementation libs.clothConfigNeoForge
    include libs.clothConfigNeoForge

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

processResources {
    def modVersion = project.version.toString()
    inputs.property "version", modVersion

    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: modVersion,
                neoforge_version: libs.neoForge.get().version,
                balm_version: libs.balmNeoForge.get().version,
                jade_neoforge_version: libs.jadeNeoForge.get().version,
                cloth_config_version: libs.clothConfigNeoForge.get().version,
                minecraft_version: libs.minecraft.get().version
    }
}

shadowJar {
    exclude "fabric.mod.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map {
        zipTree(it)
    }
}
