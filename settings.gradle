import org.gradle.api.initialization.resolve.RepositoriesMode

pluginManagement {
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Architectury'
                    url = 'https://maven.architectury.dev/'
                }
            }
            filter {
                includeGroup 'dev.architectury'
                includeGroup 'dev.architectury.loom'
                includeGroup 'architectury-plugin'
                includeGroup 'com.mojang'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = 'https://maven.fabricmc.net/'
                }
            }
            filter {
                includeGroup 'net.fabricmc'
                includeGroup 'net.fabricmc.unpick'
                includeGroup 'net.fabricmc.fabric-loom'
            }
        }

//        exclusiveContent {
//            forRepository {
        maven {
            name = 'Neoforged'
            url = 'https://maven.neoforged.net/releases/'
        }
//            }
//            filter {
//                includeGroup 'net.neoforged'
//                includeGroup 'net.neoforged.gradle.userdev'
//                includeGroup 'net.minecraftforge'
//                includeGroup 'de.oceanlabs.mcp'
//            }
//        }

        gradlePluginPortal()
    }
}

plugins {
    id 'com.gradle.develocity' version '4.4.0'
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT' apply false
    id 'net.neoforged.gradle.userdev' version '7.1.21'
}

plugins.apply(net.fabricmc.loom.LoomRepositoryPlugin)

develocity {
    buildScan {
        publishing.onlyIf { System.getenv('CI') == 'true' }
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS

    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Balm'
                    url = 'https://maven.twelveiterations.com/repository/maven-public/'
                }
            }
            filter {
                includeGroup 'net.blay09.mods'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Cloth Config'
                    url = 'https://maven.shedaniel.me/'
                }
            }
            filter {
                includeGroup 'me.shedaniel.cloth'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = 'https://maven.fabricmc.net/'
                }
            }
            filter {
                includeGroup 'net.fabricmc'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Mod Menu'
                    url = 'https://maven.terraformersmc.com/'
                }
            }
            filter {
                includeGroup 'com.terraformersmc'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Neoforged'
                    url = 'https://maven.neoforged.net/releases/'
                }
            }
            filter {
                includeGroup 'net.neoforged'
                includeGroup 'net.neoforged.accesstransformers'
                includeGroup 'net.neoforged.fancymodloader'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Tolk'
                    url = 'https://repo.granny.dev/releases/'
                }
            }
            filter {
                includeGroup 'com.davykager.tolk'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven'
                }
            }
            filter {
                includeGroup 'maven.modrinth'
            }
        }

        mavenCentral()
    }
}

rootProject.name = 'minecraft_access'
